services:
  api:
    user: bun
    image: oven/bun:latest
    container_name: yinzerflow-api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    command: sh -c "bun install && bun start"
    tty: true
    stdin_open: true

  node:
    user: node
    image: node:latest
    restart: no
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
      - /home/patrick/.npmrc:/home/node/.npmrc

  benchmark:
    image: williamyeh/wrk
    restart: no
    network_mode: host
    command: ["-t4", "-c400", "-d10s", "http://localhost:5000/status"]
    depends_on:
      - api
