# YinzerFlow checks: cheap static lanes first, the test suite last.
service = app

tier = quick
check = bunx eslint app --quiet --cache
check = bunx prettier --check app
check = bunx cspell app --no-progress --unique
check = bunx tsc --noEmit -p .

tier = slow
check = bun test --timeout=5000 --bail
